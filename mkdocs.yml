site_name: Tidy docs
site_description: Documentation for a fictional command-line tool, built and published with docs-as-code.
site_url: https://YOUR-USERNAME.github.io/simple-docs-portfolio/
repo_url: https://github.com/YOUR-USERNAME/simple-docs-portfolio
edit_uri: edit/main/docs/

# Fail the build on broken links so mistakes never reach the live site.
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Undo a tidy: undo-a-tidy.md
  - Command reference: commands.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
